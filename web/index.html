<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noAlone — Web</title>
    <script>
      // Applied before first paint so switching themes never flashes the wrong palette.
      try {
        var t = localStorage.getItem('noalone_theme');
        if (t === 'dark') t = 'night'; // migrate the old binary toggle's dark mode
        if (t === 'night' || t === 'sunset') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
